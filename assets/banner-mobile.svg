<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="Banyapon Chaithong — Full-stack, IoT and Android Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="600" height="440" rx="20" fill="url(#bg)"/>
  <rect width="600" height="440" rx="20" fill="url(#grid)"/>
  <circle cx="540" cy="30" r="130" fill="#a78bfa" fill-opacity="0.12"/>
  <circle cx="60" cy="440" r="110" fill="#38bdf8" fill-opacity="0.08"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55">
    <path d="M380 40 H460 V90 H540 V140 H580"/><path d="M420 120 H480 V170 H560"/>
  </g>
  <g fill="#38bdf8"><circle cx="460" cy="40" r="4"/><circle cx="460" cy="90" r="4"/><circle cx="540" cy="140" r="4"/><circle cx="480" cy="120" r="4"/></g>
  <circle cx="540" cy="90" r="4" fill="#a78bfa">
    <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="44" y="110" fill="#94a3b8" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24">&gt; hello world, I'm</text>
  <text x="42" y="190" fill="#f8fafc" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700">Banyapon</text>
  <text x="42" y="262" fill="#f8fafc" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="700">Chaithong</text>
  <rect x="44" y="286" width="110" height="6" rx="3" fill="url(#accent)"/>
  <text x="44" y="336" fill="url(#accent)" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600">Full-stack · IoT · Android<tspan fill="#a78bfa" dx="6">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text x="44" y="376" fill="#94a3b8" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="24">Informatics · Walailak University</text>
</svg>
