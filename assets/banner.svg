<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Banyapon Chaithong — Full-stack, IoT and Android Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="160" fill="#a78bfa" fill-opacity="0.10"/>
  <circle cx="760" cy="300" r="120" fill="#38bdf8" fill-opacity="0.08"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"><path d="M840 60 H960 V130 H1060 V210 H1160" /><path d="M780 240 H900 V180 H1000 V100 H1120" /><path d="M1000 260 V230 H1100" /></g>
  <g fill="#38bdf8"><circle cx="880" cy="60" r="4" /><circle cx="960" cy="60" r="4" /><circle cx="960" cy="130" r="4" /><circle cx="1060" cy="130" r="4" /><circle cx="1060" cy="210" r="4" /><circle cx="1140" cy="210" r="4" /><circle cx="820" cy="240" r="4" /><circle cx="900" cy="240" r="4" /><circle cx="900" cy="180" r="4" /><circle cx="1000" cy="180" r="4" /></g>
  <circle cx="1060" cy="130" r="4" fill="#a78bfa">
    <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="70" y="88" fill="#94a3b8" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22">&gt; hello world, I'm</text>
  <text x="68" y="156" fill="#f8fafc" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700">Banyapon Chaithong</text>
  <rect x="70" y="176" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="220" fill="url(#accent)" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600">Full-stack · IoT · Android Developer<tspan fill="#a78bfa" dx="6">▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text x="70" y="262" fill="#94a3b8" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="22">School of Informatics, Walailak University</text>
</svg>
